name: Woningbot

# GitHub start geplande taken vaak uren te laat. Daarom start deze bot elk uur
# een "dienst" die zelf bijna 6 uur lang elke 5 minuten checkt.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:          # knop 'Run workflow' om handmatig te starten

permissions:
  contents: write

concurrency:
  group: woningbot
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installeer browser
        run: |
          pip install -q curl_cffi playwright
          python -m playwright install --with-deps chromium

      - name: Check verhuursites elke 5 minuten
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          git config user.name "woningbot"
          git config user.email "woningbot@users.noreply.github.com"
          einde=$((SECONDS + 20400))   # ~5 uur 40 min, daarna neemt de volgende dienst het over
          while [ $SECONDS -lt $einde ]; do
            git pull -q --rebase || true        # pakt wijzigingen in sites.txt op
            echo "=== Check $(TZ=Europe/Amsterdam date '+%d-%m %H:%M')"
            python monitor.py || echo "Check mislukt, volgende poging over 5 minuten"
            git add seen.json
            git diff --cached --quiet || (git commit -q -m "Woningen bijgewerkt" && git push -q) || true
            sleep 300
          done
